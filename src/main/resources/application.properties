spring.application.name=pibblest
# Le dice a Spring el nombre base de tus archivos (messages.properties)
spring.messages.basename=messages

# Obliga a leer los archivos en UTF-8 para soportar acentos de forma nativa
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.datasource.url=${PIBBLEST_DB_URL}
spring.datasource.username=${PIBBLEST_DB_USER}
spring.datasource.password=${PIBBLEST_DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

springdoc.swagger-ui.path=/api/swagger-ui


spring.kafka.bootstrap-servers=localhost:9092

# Serializadores para que Kafka entienda tus clases Java (Records) como JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# Deserializadores para leer el JSON de regreso a Java
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.nss.pibblest.modules.owners.api